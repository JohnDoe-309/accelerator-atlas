[project]
name = "accelerator-atlas"
version = "0.1.0"
description = "Personal-use analytical dashboard for YC, SPC, a16z Speedrun, and EF cohort data"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9.0",
    "pandas>=2.2.3",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.0.1",
    "selectolax>=0.3.25",
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
    "streamlit-aggrid>=1.0.5",
    "openai>=1.55.0",
    "firecrawl-py>=2.0.0",
    "rich>=13.9.0",
    "curl-cffi>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accelerator_atlas"]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.3",
]
